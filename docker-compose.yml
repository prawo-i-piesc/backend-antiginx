services:
  backend-antiginx:
    image: ghcr.io/prawo-i-piesc/backend-antiginx:latest
    container_name: backend-antiginx
    restart: unless-stopped

    ports:
      - "${BACKEND_PORT}:4000"

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - RABBITMQ_RESULTS_QUEUE=${RABBITMQ_RESULTS_QUEUE:-}
      - RESULT_CONSUMERS=${RESULT_CONSUMERS:-}
      - RESULT_BATCH_SIZE=${RESULT_BATCH_SIZE:-}
      - GIN_MODE=${GIN_MODE:-release}
      - ACCESS_TOKEN_TTL=${ACCESS_TOKEN_TTL:-}
      - REFRESH_TOKEN_TTL=${REFRESH_TOKEN_TTL:-}
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - WEBAUTHN_RPID=${WEBAUTHN_RPID:-}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-}
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    networks:
      - vpn-net

networks:
  vpn-net:
    external: true