name: Documentation
run-name: >-
  ${{
      github.event_name == 'pull_request'
      && format('Generate Docs for CI: PR -> #{0} -> {1}', github.event.number, github.event.pull_request.title)
      ||
      github.event_name == 'push'
      && format('Generate and Deploy Docs: Merge -> {0}', github.event.head_commit.message)
  }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-ref-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Git -- Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🐍 Python -- Set up
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: 📦 Pip -- Install dependencies
        run: python -m pip install mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-include-markdown-plugin

      - name: 📜 MkDocs -- Build documentation
        run: mkdocs build --strict

      - name: 📤 Git -- Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: Deploy documentation
    needs: build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⚙️ Git -- Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: 🚀 Git -- Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
