name: Container Verification
run-name: >-
    ${{ 
        github.event_name == 'pull_request' 
        && format('Container Verification for CI: PR #{0} -> {1}', github.event.number, github.event.pull_request.title)
    }}

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    container-ci-test:
        name: Testing
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
        - name: 📥 Git -- Checkout repository
          uses: actions/checkout@v6

        - name: 🐳 Docker -- Set up
          uses: docker/setup-buildx-action@v3

        - name: 🐳 Docker -- Build Image for Scanning
          uses: docker/build-push-action@v6
          with:
            context: .
            push: false
            load: true
            tags: ${{ github.repository }}:pr-${{ github.event.pull_request.number }}-test
            cache-from: type=gha
            cache-to: type=gha,mode=max

        - name: 🛠️ Trivy -- Install binary
          env:
            TRIVY_VERSION: v0.70.0
            TRIVY_BIN_DIR: ${{ runner.temp }}/trivy-bin
          run: |
            echo "${TRIVY_BIN_DIR}" >> "${GITHUB_PATH}"
            for attempt in 1 2 3; do
                echo "⚙️ Installing Trivy ${TRIVY_VERSION} (attempt ${attempt}/3):"
                if curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
                    | sh -s -- -b "${TRIVY_BIN_DIR}" "${TRIVY_VERSION}"; then
                    echo "✅ Trivy installed."
                    exit 0
                fi
                echo "⚠️ Download failed, retrying in 15s."
                sleep 15
            done
            echo "❌ Could not install Trivy."
            exit 1

        - name: 🧪 Trivy -- Test Vuln, Secret, Misconfig -> Container Image
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            skip-setup-trivy: true
            scan-type: image
            image-ref: ${{ github.repository }}:pr-${{ github.event.pull_request.number }}-test
            ignore-unfixed: true
            scanners: vuln,secret,misconfig
            vuln-type: os,library
            format: table
            severity: CRITICAL,HIGH,MEDIUM
            exit-code: '1'